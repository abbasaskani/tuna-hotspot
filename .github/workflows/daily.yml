name: Daily Tuna Hotspots

# رویدادهایی که این workflow باید اجرا شود:
on:
  schedule:
    - cron: "0 4 * * *"      # هر روز ساعت 04:00 UTC
  workflow_dispatch:        # امکان اجرای دستی هم

# این بخش حیاتی است تا GitHub اجازه push کند
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # حداکثر زمان اجرای یک بار

    steps:
      # 1) کد ریپو را بگیر
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) پایتون را ست کن
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3) وابستگی‌ها را نصب کن
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4) اسکریپت daily را اجرا کن
      - name: Run daily pipeline
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          GFW_API_ACCESS_TOKEN: ${{ secrets.GFW_API_ACCESS_TOKEN }}
        run: |
          python src/run_daily.py

      # 5) خروجی‌ها را commit و push کن
      - name: Commit and push outputs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/latest/*
          git commit -m "Daily hotspots update" || exit 0
          git push
